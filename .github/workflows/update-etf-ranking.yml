name: 每日更新 ETF 排名
on:
  schedule:
    - cron: '30 9 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 取得證交所資料
        run: python scripts/update_data.py
      - name: 儲存最新排名
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/etf-universe.js
          git diff --cached --quiet || git commit -m "每日更新 ETF 排名"
          git push
